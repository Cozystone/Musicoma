harmony_study:   # 10-17 본인 "칸예 곡·비슷한 장르의 화성감·이론도 연구해. 창의력. 패턴에 얽매이지 말고"
  heard_in_kanye:
    - "샘플의 조 ≠ 비트의 조: Through the Wire 채보가 #IV·bII 같은 '틀린' 코드로 잡히는 건 샘플(배속으로 조가 올라감) 위에 베이스가 원래 조로 깔려서. 이 어긋남이 긴장 = 올드 칸예의 핵심. 우리도 레코드를 +4 했을 때 베이스를 샘플 조에 '완전히' 맞추지 말고 한두 마디는 비트 조로 두는 선택지를 둔다."
    - "sus4 로 버티기(Diamonds·Street Lights·Touch the Sky): I 나 V 를 3음 없이 두고 샘플이 3음을 정한다 — 장·단이 흐려져 '그리움'."
    - "I7 → IV (Touch the Sky): 가스펠·블루스식 2차 도미넌트. 장조에서 b7 한 음으로 교회 냄새."
    - "단조 i ↔ bIImaj7 (Flashing Lights): 반음 위 장7 왕복 — 차갑고 영화적. 808s 계열 곡(Vending Machine Heart)에 쓴다."
    - "IV 에서 시작해 I 로 안 가기(Street Lights·Heard 'Em Say): 루프가 IV 에 머물면 끝나지 않는 느낌 — 아웃트로를 IV 로 끝내는 선택지."
    - "루프 끝 미해결 도미넌트를 그대로 두기: 4마디 루프의 마지막 코드가 V7/vi 로 끝나 IV 로 되돌아오는 건 '틀린' 게 아니라 긴장의 반복(칸예 시티팝 02 가 그 예 — 본인이 성공작으로 꼽음)."
  heard_in_citypop:
    - "IVmaj7 ↔ iii7 왕복(Sparkle), ii7–V7sus4–Imaj7(Remember Summer Days): 7th 가 기본, 삼화음은 거의 없음."
    - "bIImaj7·bIIImaj7 모달 믹스처(真夜中のドア): 장조 안의 '밤' 색. 레코드 B 구간에 한 번 넣는다."
    - "Wall of sound(君は天然色): 코드가 안 잡힐 만큼 두껍게 — 레코드 녹음에 스트링·코러스·퍼커션 레이어."
  rules_for_album (곡마다 하나씩 다른 장치를 고른다 — 같은 장치 두 곡 금지):
    - Last Train: 레코드 B 끝에 bIIImaj7 모달 믹스처 → 배속 뒤 비트 베이스는 그 마디만 샘플 조를 따르지 않고 원래 I 를 유지(어긋남 1마디).
    - Convenience Store Lights: I7 → IV 가스펠 2차 도미넌트를 혼 스탭으로.
    - Pay Phone: 루프 끝 V7/vi 미해결 유지(칸예 시티팝 02 의 장치를 의도적으로).
    - Vending Machine Heart: i ↔ bIImaj7 왕복, 808 베이스가 제일 앞.
    - Overtime: IV 에서 시작해 I 를 sus4 로만 스치기, 찹이 3음을 정한다.
    - First Train: ii7–V7sus4–Imaj7 정통 시티팝, 마지막만 IV 로 끝내 안 끝난 느낌.
