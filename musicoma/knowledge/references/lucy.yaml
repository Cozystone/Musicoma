summary:
  key: "전부 장조(D·F·C·C#·E·G). 밝은 조. 단조 색은 vi 로 시작하는 후렴·가운데 구간에서만."
  chords: "다이어토닉 + 7th·sus4 색(Imaj7·vi7·IVmaj7·Isus4·V7sus4). 후렴은 두세 코드로 길게 버티기도(전체관람가 IV–I). bVII 는 히어로 정도. 전조·비다이어토닉 거의 없음."
  tone: "presence -14~-22, air -18~-31 (놀이·개화가 가장 밝고 아니근데진짜가 가장 어두움). low -2~-8. 폭 side/mid -5~-8 dB(넓음), 상관 0.5~0.75."
  balance: "보컬이 가장 앞(-2.5~-8, 대개 -3~-6) → 드럼(-5~-11) → 기타·바이올린(other -6~-10). 베이스 측정은 흔들림(-5~-26) — 신뢰 못 함."
  vocal: "남성 테너, 중앙 D4~E4, 저음 F3~A3, 고음 A5~B5 까지(가성·샤우트 섞음). 음절 2.5~3.6/s — 빠르지 않고 또박또박. 하모니는 후렴 위에 3도."
  rhythm: "스윙 0.49~0.58(거의 곧음, 개화만 살짝 셔플). 어택 4.2~5.5/s(중간 밀도). 템포는 측정 불신 — 들어서는 아니근데진짜 ~143, 전체관람가 ~136, 개화·히어로 ~89(반박자 느낌의 미드템포)."
  form: "첫 큰 반복(후렴)이 25~87초 — 아니근데진짜는 1초부터 큰 소리(인트로=후렴급). 후렴 블록이 길고(12~34마디) 브레이크는 2~5마디로 짧게. 끝은 후렴 재진입 후 짧게."
  instruments_heard: "보컬·기타(클린~크런치, 스트럼 위주) + 바이올린(선율·대선율·인트로 리프, 기타 솔로 자리를 바이올린이 맡음) + 베이스 + 드럼. 피아노·신스 패드는 보조. 측정으로 악기 종류는 못 잼 — 들어서 안 것."
apply_to_four_oclock:
  - "조·코드: A 장조 다이어토닉 + maj7/m7/sus4 유지. 후렴 끝 bVII 한 번은 히어로 선례 안."
  - "밝기: presence -16~-18 · air -24~-27 목표 (v3: -17.1 / -27.2 ✔)."
  - "폭: side/mid -6~-8 dB 목표 — 기타 좌우 분리 + 바이올린 오른쪽."
  - "균형: 보컬이 제일 앞(+2.5 LU), 드럼 다음, 기타는 뒤 (현재 balance_lu 그대로)."
  - "보컬: 중앙 E4 근처, 후렴 고음 A4~C#5, 마지막 후렴만 E5 터치. 음절 ≤3.5/s."
  - "악기: 바이올린이 선율 악기(절 대답·프리 긴 활·후렴 훅 옥타브 위·브리지 대선율). 리드 기타는 리프·대선율만."
  - "구성: 후렴 61초(선례 안). 브레이크는 짧게(build 4마디 + 한 박 정적)."
