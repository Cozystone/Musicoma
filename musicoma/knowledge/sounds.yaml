# 쓸 수 있는 소리 카탈로그 — 역할별. path 는 D:/0.Musicoma 기준 상대.
# 엔진: device.add {device: 'sfz', sfz: <path>} | {device: 'Surge XT'} 후 device.load_file {path: <fxp>}

sfz:
  piano_grand: {path: sounds/sfz/salamander-grand-piano/Salamander Grand Piano V3.sfz, range: [21, 108], note: "어쿠스틱 그랜드, 벨로시티 16단"}
  drums_acoustic_basic: {path: sounds/sfz/virtuosity-drums/Programs/01-basic-kit.sfz, map: gm, note: "라이브 킷, 근접+룸. 붐뱁엔 컴프·새추레이션 필수"}
  drums_acoustic_full: {path: sounds/sfz/virtuosity-drums/Programs/02-full-kit.sfz, map: gm}
  drums_vintage: {path: sounds/sfz/virtuosity-drums/Programs/08-vintage-mic.sfz, map: gm, note: "빈티지 마이크 — 붐뱁/소울에 잘 맞음"}
  # VSCO2 CE 오케스트라 — 파일 이름으로 찾기: sounds/sfz/vsco2-ce/*.sfz
  strings_violins: {path: sounds/sfz/vsco2-ce/ViolinEnsSusVib.sfz, alt: [ViolinEnsPizz, ViolinEnsSpic, ViolinEnsTrem, ViolinEnsSusVib-Quiet]}
  strings_violas: {path: sounds/sfz/vsco2-ce/ViolaEnsSusVib.sfz}
  strings_cello: {path: sounds/sfz/vsco2-ce/CelloEnsSusVib.sfz, alt: [CelloEnsPizz, CelloEnsSpic]}
  contrabass: {path: sounds/sfz/vsco2-ce/ContrabassSusVB.sfz, alt: [ContrabassPizz]}
  solo_violin: {path: sounds/sfz/vsco2-ce/SViolinVib.sfz}
  horn: {path: sounds/sfz/vsco2-ce/FHornSus.sfz, alt: [FHornStac, FHornMute]}
  trumpet: {path: sounds/sfz/vsco2-ce/TrumpetSusVib.sfz, alt: [TrumpetStac, TrumpetHarmonMuteSus]}
  trombone: {path: sounds/sfz/vsco2-ce/TromboneSus.sfz, alt: [TromboneStac]}
  tuba: {path: sounds/sfz/vsco2-ce/TubaSus.sfz}
  flute: {path: sounds/sfz/vsco2-ce/FluteSusVib.sfz, alt: [FluteStac]}
  clarinet: {path: sounds/sfz/vsco2-ce/ClarinetSus.sfz}
  oboe: {path: sounds/sfz/vsco2-ce/OboeSusVib.sfz}
  bassoon: {path: sounds/sfz/vsco2-ce/BassoonSus.sfz}
  harp: {path: sounds/sfz/vsco2-ce/Harp.sfz}
  glockenspiel: {path: sounds/sfz/vsco2-ce/Glockenspiel.sfz}
  marimba: {path: sounds/sfz/vsco2-ce/Marimba.sfz}
  xylophone: {path: sounds/sfz/vsco2-ce/Xylophone.sfz}
  tubular_bells: {path: sounds/sfz/vsco2-ce/TubularBells.sfz}
  timpani: {path: sounds/sfz/vsco2-ce/Timpani.sfz}
  upright_piano: {path: sounds/sfz/vsco2-ce/UprightPiano.sfz, note: "낡은 업라이트 — 로파이·소울에 좋음"}
  church_organ: {path: sounds/sfz/vsco2-ce/OrganQuiet.sfz}
  orchestral_perc: {path: sounds/sfz/vsco2-ce/GM-StylePerc.sfz, map: gm}
  # 10-15 추가 — Karoryfer(CC0-1.0, GitHub sfzinstruments 확인) · Greg Sullivan EP(CC-BY 3.0, 출처 표기 필요)
  drums_studio: {path: sounds/sfz/sm-drums/Programs/SM_Drums_kit.sfz, map: gm, note: "깨끗한 스튜디오 킷 — 시티팝·팝·AOR. 퍼블릭 도메인(SM Drums: Scott McLean·Tod Stillwell·Suleiman Ali)"}
  drums_rusty: {path: sounds/sfz/karoryfer-big-rusty-drums/Programs/02-basic.sfz, map: gm, note: "거칠고 빈티지한 킷(스틱) — 붐뱁·소울 1순위. CC0"}
  drums_rusty_full: {path: sounds/sfz/karoryfer-big-rusty-drums/Programs/01-full.sfz, map: gm, note: "브러시·말렛 포함 전체. CC0"}
  bass_hollow_finger: {path: sounds/sfz/karoryfer-black-and-blue-basses/Programs/04-babyblue_warm.sfz, note: "할로우바디 핑거 베이스(따뜻) — 소울·시티팝·네오소울. CC0"}
  bass_picked: {path: sounds/sfz/karoryfer-black-and-blue-basses/Programs/06-darkblack_pluck_warm.sfz, note: "솔리드바디 피크 베이스. CC0"}
  upright_bass: {path: sounds/sfz/karoryfer-meatbass/Meatbass/Programs/04_pizz.sfz, note: "1958 더블베이스 피치카토 — 재즈·로파이. CC0"}
  guitar_archtop: {path: sounds/sfz/karoryfer-shinyguitar/Shinyguitar/Programs/musicoma_electric.sfz, note: "할로우 아치톱 픽업 — 재즈·소울·시티팝 클린. CC0"}
  guitar_archtop_mic: {path: sounds/sfz/karoryfer-shinyguitar/Shinyguitar/Programs/musicoma_mic.sfz, note: "같은 기타 마이크 녹음. CC0"}
  alto_sax: {path: sounds/sfz/karoryfer-weresax/Weresax/Programs/alto_map_forte_condenser.sfz, note: "알토 색소폰. CC0"}
  wurlitzer: {path: "sounds/sfz/gregsullivan-epianos/Wurlitzer EP200/Wurlitzer EP200.sfz", note: "부를리처 EP200 — 소울·로파이. CC-BY 3.0 Greg Sullivan"}
  cp80: {path: sounds/sfz/gregsullivan-epianos/CP80/CP80.sfz, note: "야마하 CP80 — 80s 시티팝. CC-BY 3.0 Greg Sullivan"}
  # 10-16 자체 합성(musicoma/kits.py, CC0) — 브라질리언 퐁크
  drums_phonk: {path: sounds/sfz/musicoma-phonk/phonk_kit.sfz, map: gm, note: "808 식 킥·클랩·림·햇·탬버린·카우벨(56) — 퐁크·바일리 펑크·트랩"}
  cowbell_808: {path: sounds/sfz/musicoma-phonk/cowbell.sfz, note: "TR-808 식 카우벨을 음높이로 — 퐁크 선율 악기"}
  bass_808_dist: {path: sounds/sfz/musicoma-phonk/808.sfz, range: [24, 60], note: "디스토션을 구운 808 — 세기 70 이하 약, 71~105 중, 106~ 강"}

