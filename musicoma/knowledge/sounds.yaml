  dx_ep: [Keys/DX EP.fxp]
  organ: [Keys/Organ 1.fxp, Keys/Organ 2.fxp, Keys/Organ 3.fxp, Keys/House Organ.fxp]
  bass_sub: [Basses/Sub 1.fxp, Basses/Sub 2.fxp, Basses/Deep End.fxp]
  bass_finger: [Basses/Fingered.fxp, Basses/E-Bass.fxp, Basses/Mellow.fxp]
  bass_slap: [Basses/FM Slap.fxp]
  bass_synth: [Basses/Rubber Bass.fxp, Basses/FM Bass 2.fxp, Basses/Wide Bassline.fxp]
  pad_warm: [Pads/MKS-70 Warm Pad.fxp, Pads/Winter Warmer.fxp, Pads/Pad 1.fxp]
  pad_choir: [Pads/Choir Pad Thing.fxp, Pads/Retro Choir.fxp, Pads/Ooh.fxp]
  brass_synth: [Brass/Synth Brass 2.fxp, Brass/Toto Brass.fxp, Brass/JX-10 Double Brass.fxp, Brass/OB-8 Jump.fxp]
  stab_chord: [Chords/Major 7 MkI.fxp, Chords/Minor 7.fxp]
  guitar_ish: [Plucks/E-Guitar.fxp, Plucks/Clean.fxp, Plucks/Guitar.fxp]
