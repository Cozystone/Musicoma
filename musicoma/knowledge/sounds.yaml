effects:   # device 이름 그대로 device.add
  builtin: [eq, compressor, reverb, delay, chorus, phaser, lowpass, pitchshift, send, return]
  vst3:
    - {name: "Dragonfly Hall Reverb", use: "큰 홀/플레이트 같은 긴 잔향 — 리턴 버스용"}
    - {name: "Dragonfly Room Reverb", use: "드럼 룸, 짧은 공간"}
    - {name: "Dragonfly Plate Reverb", use: "보컬·스네어 플레이트"}
    - {name: "Dragonfly Early Reflections", use: "가까운 공간감"}
    - {name: "Surge XT Effects", use: "Surge 의 모든 이펙트(새추레이션, 테이프, 필터, 보코더...)"}
    - {name: "Airwindows Consolidated", use: "Airwindows 수백 종 — 콘솔·테이프·새추레이션·컴프"}

generators:
  ace_step: "musicoma.gen.generate — 보컬 포함 원곡/샘플 소스 생성 (로컬 ACE-Step 1.5)"
  demucs: "musicoma.crate.separate — vocals/drums/bass/other 분리"

user_sources: "sounds/inbox/ 에 본인이 넣은 파일 — 본인 소유로 간주하고 그대로 쓴다"
